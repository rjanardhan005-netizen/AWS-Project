# ============================================================
# Nginx Reverse Proxy Configuration (BROKEN — FOR DEMO)
# ============================================================
# ⚠️  THIS FILE IS INTENTIONALLY BROKEN!
#
# It demonstrates a common misconfiguration that causes a
# 502 Bad Gateway error.
#
# What's wrong:
#   1. The frontend upstream uses port 9999 instead of 3000.
#      → The React container listens on 3000, not 9999,
#        so the connection is refused.
#   2. The backend upstream uses port 9999 instead of 8000.
#      → The FastAPI container listens on 8000, not 9999,
#        so the connection is refused.
#
# Why use wrong ports instead of wrong hostnames?
#   Nginx resolves upstream hostnames at config-load time.
#   If a hostname is invalid, `nginx -s reload` is REJECTED
#   and Nginx keeps its previous working config — so the 502
#   would never appear. Using valid service names with wrong
#   ports lets the reload succeed, but every proxied request
#   gets "Connection refused" → reliable 502 Bad Gateway.
#
# Result:
#   - Visiting http://localhost       → 502 Bad Gateway
#   - Visiting http://localhost/api/  → 502 Bad Gateway
#
# How to fix:
#   - Replace this file with nginx.conf (the correct version).
#   - Reload Nginx:  docker exec nginx-proxy nginx -s reload
# ============================================================

# ❌ WRONG port: should be 3000, not 9999
upstream frontend_server {
    server frontend:9999;
}

# ❌ WRONG port: should be 8000, not 9999
upstream backend_server {
    server backend:9999;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 502 /502.html;
    location = /502.html {
        root /usr/share/nginx/html;
        internal;
    }
}
