# ============================================================
# Nginx Reverse Proxy Configuration (CORRECT / WORKING)
# ============================================================
# This is the CORRECT configuration where service names and
# ports match the Docker Compose service definitions.
#
# Routing:
#   /          → frontend:3000  (React app)
#   /api/      → backend:8000   (FastAPI)
#
# Key concept:
#   In Docker Compose, containers can reach each other by
#   their SERVICE NAME. So "frontend" resolves to the React
#   container's IP, and "backend" resolves to the FastAPI
#   container's IP — all on the internal Docker network.
# ============================================================

upstream frontend_server {
    server frontend:3000;
}

upstream backend_server {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # ── React Frontend ────────────────────────────────────
    # All requests to / are forwarded to the React container.
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── FastAPI Backend ───────────────────────────────────
    # All requests to /api/ are forwarded to the FastAPI container.
    location /api/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Error Pages ───────────────────────────────────────
    error_page 502 /502.html;
    location = /502.html {
        root /usr/share/nginx/html;
        internal;
    }
}
